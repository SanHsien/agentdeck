# The AI Update Daily page renders a file committed to this repository, and
# nothing refreshed it — so the menu item opened a digest frozen on the day of
# the fork. Upstream commits "chore: sync AI updates" every day or two and the
# file is public, so mirror it on a schedule.
name: 同步 AI 更新資料

on:
  schedule:
    # Upstream publishes roughly every one to two days; check daily, commit only
    # when the content actually changed.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both scripts are stdlib-only, so the runner's python3 is enough and
      # there is no toolchain action to keep pinned.
      - name: Fetch upstream digest and rebuild the page
        id: sync
        run: |
          set +e
          python3 scripts/sync_ai_updates.py
          code=$?
          set -e
          case "$code" in
            0)  echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *)  echo "sync refused; leaving the committed digest alone" >&2; exit 1 ;;
          esac

      - name: Commit the refreshed digest
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_updates.json docs/ai-updates/index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync AI updates from upstream"
          git push
