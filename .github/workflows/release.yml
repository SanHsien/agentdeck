name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv python install 3.13

      - name: Check lockfile freshness
        run: uv lock --check

      - name: Install Windows build dependencies
        run: |
          uv sync --frozen --group dev --extra windows
          uv pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      # build_windows.ps1 already checks the exe against pyproject.toml. This
      # closes the last gap: a tag pointing at a commit whose version differs.
      - name: Check the tag matches the built executable
        shell: pwsh
        run: |
          $tag = "${{ steps.ref.outputs.tag }}" -replace '^v', ''
          $doctor = & ./dist/agentdeck-windows/agentdeck.exe --doctor 2>&1 | Out-String
          if ($doctor -notmatch "agentdeck v([0-9]+\.[0-9]+\.[0-9]+)") {
            throw "agentdeck.exe --doctor did not report a version. Output:`n$doctor"
          }
          if ($Matches[1] -ne $tag) {
            throw "Tag v$tag does not match the built executable, which reports $($Matches[1])."
          }
          Write-Host "tag v$tag matches the built executable" -ForegroundColor Green

      - name: Zip Windows bundle
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ steps.ref.outputs.tag }}" dist/agentdeck-windows.zip dist/agentdeck-windows.zip.sha256 --clobber
