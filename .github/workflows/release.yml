name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv python install 3.13

      - name: Install Windows build dependencies
        run: |
          uv sync --frozen --group dev --extra windows
          uv pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Zip Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist/agentdeck-windows -DestinationPath dist/agentdeck-windows.zip
          $hash = (Get-FileHash dist/agentdeck-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  agentdeck-windows.zip" | Out-File -FilePath dist/agentdeck-windows.zip.sha256 -Encoding ascii -NoNewline

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ steps.ref.outputs.tag }}" dist/agentdeck-windows.zip dist/agentdeck-windows.zip.sha256 --clobber

