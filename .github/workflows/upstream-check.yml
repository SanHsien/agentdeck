name: 上游更新檢查

on:
  schedule:
    # 每天 02:00 UTC 檢查 aqua5230/usage main 是否有比 docs/UPSTREAM.md 的
    # last_reviewed 更新的 commit。上游幾乎每天 commit（多半是 chore: sync AI
    # updates，只動本 fork 已移除的 ai_updates.json），但檢查器會先判斷每個
    # commit 有沒有動到本 fork 真的擁有的檔案——全部都不影響時不開 issue。
    # 過濾器就位之後，每天跑只換來更短的延遲，不會製造雜訊。
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 設定 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: 檢查上游更新
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/check_upstream_updates.py \
            --github-output \
            --output upstream-check-report.md

      - name: 建立或更新提醒 issue
        if: steps.upstream.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 沿用同一個 issue，避免每週開一張新的把列表淹掉。
          issue="$(gh issue list --state open --search '上游更新檢查 in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file upstream-check-report.md
          else
            gh issue create \
              --title "上游更新檢查：有新 commit 待審視" \
              --body-file upstream-check-report.md
          fi

      - name: 沒有更新時關閉提醒 issue
        # 原本只有上面「有更新就開／更新 issue」這一半。水位追上之後 has_updates 變成
        # false，卻沒有對應的收尾步驟，issue 會一直開著、只能手動關（2026-09-10 的 #19）。
        # 同 repo 的 dependency-freshness.yml 早就有對稱的關閉步驟，這裡補齊。
        # Actions 表達式的字串比較不分大小寫，檢查器輸出的 "False" 也會命中 'false'。
        # 檢查步驟本身失敗時 job 會在前一步停下，不會走到這裡誤關 issue。
        if: steps.upstream.outputs.has_updates == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --search '上游更新檢查 in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "本次排程檢查輸出 has_updates=false：沒有需要人工審視的上游項目，關閉提醒。逐筆判定見 docs/UPSTREAM.md。"
          fi
